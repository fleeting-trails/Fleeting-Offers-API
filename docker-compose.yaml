services:
  app:
    container_name: fleetingoffers_api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIG: Release
    # environment:
    #   JwtToken__Secret: ${JWT_SECRET}
    #   MailSettings__Password: ${MAIL_PASSWORD}
    #   Developer__Secret: ${DEVELOPER_SECRET}
    #   Database__ConnectionString: ${DB_CONNECTION}
    #   Redis__ConnectionString: ${REDIS_CONNECTION}
    env_file:
      - .env
    ports:
      - 5001:8080
  postgres:
    image: postgres:17.5
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: postgres
    ports:
      - 5433:5432
    volumes:
      - ./data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:8.0.0
    container_name: redis
    restart: always
    ports:
      - 6380:6379
